name: Bootstrap R4

on:
  push:
    branches: [main]
    paths:
      - "central_de_materiais_repo_bootstrap.zip"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf /tmp/central-materiais-r4
          mkdir -p /tmp/central-materiais-r4
          unzip -q central_de_materiais_repo_bootstrap.zip -d /tmp/central-materiais-r4
          rsync -a --delete --exclude='.git' /tmp/central-materiais-r4/ ./

      - name: Install dependencies
        run: npm install

      - name: Validate build
        run: npm run build

      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: bootstrap Central de Materiais R4 multi-store"
            git push
          fi
