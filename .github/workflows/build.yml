name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify live no-secret P0 auth guards
        run: npm test
        env:
          VITE_SUPABASE_URL: https://pkpihrxucorfbniltdtk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lEJkwAfFUbo-yvqGeQIB1Q_T-W3pS_e

      # Uses the existing Workers name in wrangler.jsonc.
      # Does not deploy unless the repository owner configured both Cloudflare secrets.
      - name: Deploy to Cloudflare Workers when authorized
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deployment skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository secrets."
          else
            npx --yes wrangler@4 deploy --config wrangler.jsonc
          fi
