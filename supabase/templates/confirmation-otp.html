<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirme seu cadastro</title>
</head>
<body style="margin:0;padding:28px 12px;background:#f2f6f3;font-family:Arial,sans-serif;color:#20382c">
  <div style="max-width:520px;margin:0 auto;background:#fff;border:1px solid #d7e6da;border-radius:16px;padding:30px">
    <p style="color:#246047;font-weight:bold;font-size:17px;margin-top:0">Central de Materiais</p>
    <h1 style="font-size:24px;margin-bottom:12px">Confirme seu e-mail</h1>
    <p style="font-size:15px;line-height:1.6">Informe o código abaixo no site para concluir seu cadastro:</p>
    <p style="font-family:monospace;font-size:35px;font-weight:bold;letter-spacing:9px;color:#145a3c;text-align:center;margin:30px 0">{{ .Token }}</p>
    <p style="font-size:13px;color:#627469;line-height:1.5">O código é pessoal e temporário. Nunca o compartilhe. Se não solicitou este cadastro, ignore esta mensagem.</p>
  </div>
</body>
</html>
